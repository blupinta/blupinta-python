# Releases the SDK to PyPI with trusted publishing, no token stored anywhere (PyPI trusts this workflow of this
# repository): a tag `v<version>` builds the package and publishes it from the `pypi` environment. The tag must name
# the package's own version. Tags are pushed by the owner only.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blupinta/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
      - name: The tag names the package's version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
